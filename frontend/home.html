<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Falcon Eye</title>
    <script src="i18n.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="role.css">
    <link rel="stylesheet" href="rtl.css">
    <style>
        body { 
            margin: 0; 
            height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
                        color: var(--text); 
            font-family: var(--font);
            
        }
        
        .portal-container { 
            text-align: center; 
            max-width: 1000px; 
            width: 90%; 
            animation: fadeIn 0.8s ease-out;
        }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        
        .header { margin-bottom: 60px; }
        .header h1 { font-size: 3rem; font-weight: 800; margin-bottom: 10px; letter-spacing: -0.02em; }
        .header p { font-size: 1.2rem; color: var(--muted); max-width: 600px; margin: 0 auto; line-height: 1.6; }
        
        .role-grid { 
            display: grid; 
            grid-template-columns: repeat(2, 1fr); 
            gap: 30px; 
        }
        
        .role-card { 
            background: var(--surface-2); 
            backdrop-filter: blur(12px);
            padding: 40px 30px; 
            border-radius: 24px; 
            border: 1px solid var(--border); 
            cursor: pointer; 
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            text-decoration: none;
            color: inherit;
        }
        
        .role-card:hover { 
            transform: translateY(-10px); 
            border-color: var(--accent); 
            background: var(--surface-3);
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }
        
        .role-icon { 
            width: 64px; 
            height: 64px; 
            border-radius: 16px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 2rem; 
            margin-bottom: 10px;
        }
        
        .role-faisal { border-bottom: 4px solid #1b8354; }
        .role-faisal .role-icon { background: rgba(31, 179, 107, 0.2); color: #1b8354; }
        
        .role-mansour { border-bottom: 4px solid #1b8354; }
        .role-mansour .role-icon { background: rgba(45, 140, 255, 0.2); color: #1b8354; }
        
        .role-classic { border-bottom: 4px solid #4b5563; }
        .role-classic .role-icon { background: rgba(148, 163, 184, 0.2); color: #4b5563; }
        
        .role-name { font-size: 1.5rem; font-weight: 700; margin: 0; }
        .role-desc { font-size: 0.9rem; color: var(--muted); line-height: 1.5; }
    </style>
</head>
<body>
    <div class="portal-container">
        <div class="header">
            <h1>Falcon Eye</h1>
            <p>City services and mobility in one command center. Select your role to enter.</p>
        </div>
        
        <div class="role-grid">
            <a href="strategic_dashboard.html" class="role-card role-faisal">
                <div class="role-icon">🏛️</div>
                <div class="role-name">Executive Hub</div>
                <div class="role-desc">Strategic oversight, City Health KPIs, and high-level risk management.</div>
            </a>

            <a href="index.html" class="role-card role-classic">
                <div class="role-icon">🗺️</div>
                <div class="role-name">Operational Center</div>
                <div class="role-desc">Real-time triage, agent coordination, imagery comparison and field dispatch control.</div>
            </a>
        </div>
    </div>
</body>
</html>
