<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Falcon Eye</title>
<link rel="icon" type="image/svg+xml" href="/falcon-eye.svg">
<script src="i18n.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="role.css">
<link rel="stylesheet" href="mobility.css">
<link rel="stylesheet" href="rtl.css">
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="https://js.arcgis.com/4.30/esri/themes/light/main.css">
<script src="theme.js"></script>
<script src="https://js.arcgis.com/4.30/"></script>
<style>
body.role { --role-accent: #1b8354; grid-template-columns: 360px 1fr 380px; }
/* header in the style of the Operation page: logo, two-line title, rounded controls */
body.role { grid-template-rows: auto 1fr auto; }
.role .top { padding: 12px 20px; gap: 12px; flex-wrap: wrap; border-bottom: 1px solid var(--border); }
.role .brand { gap: 12px; }
.role .brand .logo { width: 34px; height: 34px; fill: none; stroke: #1b8354; stroke-width: 1.7; stroke-linecap: round; flex: none; }
.role .brand b { font-size: 20px; letter-spacing: .06em; display: block; line-height: 1.1; }
.role .brand span { color: #4b5563; font-size: 12.5px; font-weight: 400; display: block; margin-top: 2px; }
.role nav { gap: 8px; }
.role nav a { background: var(--surface-3); border: 1px solid var(--border-strong); border-radius: 10px; padding: 8px 14px; color: var(--text); }
.role nav a:hover { filter: brightness(1.15); background: var(--surface-3); }
.role nav a.active { background: var(--role-accent); border-color: var(--role-accent); color: var(--on-accent); }
.updated { font-size: var(--fs-xs); color: #14573a; display: flex; align-items: center; gap: 8px; margin-inline-end: 12px; background: #f9fafb88; border: 1px solid var(--border); border-radius: var(--r-full); padding: 7px 12px; }
.updated i { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); animation: pulse 2s infinite; }
@keyframes pulse { 50% { opacity: .3; } }
.topright { display: flex; align-items: center; gap: 0; flex-wrap: wrap; row-gap: 8px; }
/* health hero */
.hero { display: flex; align-items: center; gap: 16px; background: linear-gradient(135deg, var(--surface-2), var(--surface-3)); }
.ring { --p: 0; --c: var(--ok); width: 92px; height: 92px; border-radius: 50%; flex: none; display: grid; place-items: center;
  background: conic-gradient(var(--c) calc(var(--p) * 1%), var(--border) 0); transition: background .6s; }
.ring b { width: 70px; height: 70px; border-radius: 50%; background: var(--surface-2); display: grid; place-items: center; font-size: 22px; }
.hero .label { font-size: var(--fs-xs); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.hero .state { font-size: var(--fs-lg); font-weight: 700; margin: 2px 0; }
.hero .why { font-size: var(--fs-xs); color: var(--muted); line-height: 1.4; }
/* kpi grid */
.kgrid { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 10px; padding: 0 14px 14px; }
.kgrid .card { border-left: 3px solid var(--k, var(--border)); }
.left { scrollbar-width: none; }
.left::-webkit-scrollbar { display: none; }
.kgrid { gap: 8px; }
.kgrid .kpi { padding: 10px 12px; }
.kgrid .kpi .val { font-size: 26px; line-height: 1.1; margin-top: 2px; }
.left .hero { padding: 10px 14px; }
.left .ring { width: 78px; height: 78px; }
.left .ring b { width: 60px; height: 60px; font-size: 19px; }
.left h2 { margin-top: 10px; }
.kgrid .kpi .label { font-size: 12px; font-weight: 600; letter-spacing: .02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kgrid .kpi .sub { font-size: 13px; }
html.rtl .kgrid .kpi .label { font-size: 15px; font-weight: 600; letter-spacing: 0; }
html.rtl .kgrid .kpi .sub { font-size: 14px; }
.kgrid .kpi:last-child:nth-child(odd) { grid-column: 1 / -1; }
.kgrid .kpi .label { display: flex; gap: 6px; align-items: center; }
.kgrid svg { width: 14px; height: 14px; stroke: var(--k); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.skel { height: 74px; border-radius: var(--r-md); background: linear-gradient(90deg, var(--surface-2), var(--surface-3), var(--surface-2)); background-size: 200% 100%; animation: sh 1.2s infinite; }
@keyframes sh { to { background-position: -200% 0; } }
/* trend + hotspot bars */
.spark-wrap { display: flex; gap: 6px; align-items: stretch; }
.spark-y { display: flex; flex-direction: column; justify-content: space-between; font-size: 10px; color: var(--muted); text-align: right; min-width: 16px; padding: 2px 0; }
.spark { flex: 1; min-width: 0; height: 110px; display: block; }
.spark-x { display: flex; justify-content: space-between; font-size: 10px; color: var(--muted); margin: 3px 0 0 22px; }
.spark-x .sq { opacity: .6; font-size: 9px; }
.legend-inline span { white-space: nowrap; }
.legend-inline b { color: var(--text, #111827); font-weight: 600; margin-inline-start: 2px; }
.legend-inline { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: var(--fs-xs); color: var(--muted); margin-top: 6px; }
.legend-inline span::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 5px; background: var(--c); }
.bar { height: 6px; border-radius: 3px; background: var(--border); margin-top: 8px; overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: 3px; background: var(--c, var(--ok)); transition: width .6s; }
/* map controls */
.mapmode { position: absolute; top: 14px; right: 14px; z-index: 6; width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--border-strong); background: color-mix(in srgb, var(--surface) 90%, transparent); color: var(--text); cursor: pointer; display: grid; place-items: center; padding: 0; }
.mapmode .mm { font-size: 12.5px; font-weight: 700; direction: ltr; }
.mapmode.on { border-color: var(--role-accent); color: var(--role-accent); }
.mapmode:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.layers { position: absolute; top: 58px; right: 14px; z-index: 5; display: flex; flex-direction: column; gap: 6px; background: color-mix(in srgb, var(--surface) 90%, transparent); border: 1px solid var(--border); border-radius: var(--r-md); padding: 10px 12px; font-size: var(--fs-sm); }
.layers label { display: flex; align-items: center; gap: 8px; cursor: pointer; }
.layers input { accent-color: var(--role-accent); }
/* layout: a Hotspots strip across the bottom, and an Executive Briefs column that folds away */
body.role { grid-template-rows: auto 1fr auto; grid-template-areas: "top top top" "left map right" "hot hot hot"; }
.hotbar { grid-area: hot; background: var(--surface); border-top: 1px solid var(--border); padding: 8px 18px 14px; max-height: 38vh; overflow-y: auto; }
.hotbar h2 { margin: 0 0 8px; font-size: var(--fs-sm); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.hotrow { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; }
.hotrow .empty { grid-column: 1 / -1; padding: 8px; }
.collapse { margin-inline-start: auto; width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--border-strong); background: var(--surface-3); color: var(--text); cursor: pointer; display: grid; place-items: center; padding: 0; flex: none; }
.collapse svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; transition: transform .25s; }
.collapse:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
html.rtl .collapse svg { transform: scaleX(-1); }
body.rc { grid-template-columns: 360px 1fr 52px; }
body.rc .right > :not(h2) { display: none; }
body.rc .right > h2 { flex-direction: column; align-items: center; justify-content: flex-start; gap: 10px; padding: 14px 0; }
body.rc .right > h2 .ttl { writing-mode: vertical-rl; transform: rotate(180deg); letter-spacing: .06em; }
html.rtl body.rc .right > h2 .ttl { transform: none; }
body.rc .collapse { margin: 0; }
body.rc .collapse svg { transform: scaleX(-1); }
html.rtl body.rc .collapse svg { transform: none; }
@media (max-width: 1000px) {
  body.role, body.rc { grid-template-rows: auto auto 50vh auto auto; grid-template-areas: "top" "left" "map" "right" "hot"; }
  body.rc .right > :not(h2) { display: revert; }
  .collapse { display: none; }
  .hotbar { max-height: none; }
  body.role, body.rc { height: auto; min-height: 100%; }   /* phone: the page scrolls; the side columns show all their cards instead of a 60 px strip */
  .role .left, .role .right { overflow: visible; min-height: auto; }
}
/* tabs */
.tabs { display: flex; gap: 6px; padding: 0 14px 10px; }
.tabs button { flex: 1; padding: 7px; border-radius: var(--r-full); border: 1px solid var(--border); background: transparent; color: var(--muted); font-size: var(--fs-sm); cursor: pointer; }
.tabs button.on { background: var(--role-accent); border-color: var(--role-accent); color: var(--on-accent); font-weight: 700; }
.tabs button:focus-visible, .layers input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body class="role">
<header class="top">
  <div class="brand">
    <svg viewBox="0 0 24 24" class="logo" aria-hidden="true"><path d="M2 11C5 6 8.5 4.5 12 4.5S19 6 22 11C19 16 15.5 17.5 12 17.5S5 16 2 11Z"/><circle cx="12" cy="11" r="3.8"/><circle cx="12" cy="11" r="1.5" fill="#1b8354" stroke="none"/><path d="M12 17.5c0 2-.8 3.2-2.6 4.2"/></svg>
    <div><b>Falcon Eye</b><span>Executive Hub</span></div>
  </div>
  <div class="topright">
    <div class="updated" aria-live="polite"><i></i><span id="upd">Loading…</span></div>
    <nav><a href="home.html">Portal</a><a class="active" href="strategic_dashboard.html">Strategic</a><a href="index.html">Operation</a></nav>
  </div>
</header>

<aside class="left">
  <h2>City Overview</h2>
  <div class="stack"><div class="card hero" id="hero"><div class="skel" style="width:100%"></div></div></div>
  <div class="kgrid" id="kpis"><div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>
  <h2>Incident Trend · 45 days</h2>
  <div class="stack"><div class="card" id="trend"></div></div>
</aside>

<main class="mapwrap">
  <div class="pill"><i></i><span>Strategic view · urban change &amp; incidents</span></div>
  <div class="layers" role="group" aria-label="Map layers">
    <label><input type="checkbox" id="l-change" checked> Urban change</label>
    <label><input type="checkbox" id="l-inc" checked> Incidents</label>
    <label><input type="checkbox" id="l-crit"> Critical only</label>
  </div>
  <button class="mapmode" id="mapmode" type="button" title="Switch between 2D and 3D view" aria-label="Switch between 2D and 3D view"><span class="mm">2D</span></button>
  <div id="map"></div>
  <div class="legend"><span style="--c:#1b8354">Urban change candidate</span><span style="--c:#d92d20">P1 / Critical incident</span><span style="--c:#dc6803">Other open incident</span></div>
</main>

<aside class="right" id="briefs-col">
  <h2><span class="ttl">Executive Briefs</span> <span class="badge" id="brief-count">0</span>
    <button class="collapse" id="rtoggle" type="button" aria-expanded="true" aria-controls="briefs-col" title="Collapse Executive Briefs" aria-label="Collapse Executive Briefs"><svg viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></svg></button></h2>
  <div class="row"><button class="go" id="gen">Generate daily report</button><button id="refresh">Refresh</button></div>
  <div class="row" id="brief-pdf"><span>Daily brief (PDF)</span> <a href="/api/brief.pdf?lang=en" target="_blank" rel="noopener">English</a> <a href="/api/brief.pdf?lang=ar" target="_blank" rel="noopener" lang="ar">العربية</a></div>
  <div class="tabs" role="tablist"><button class="on" data-f="crit" role="tab">Critical</button><button data-f="all" role="tab">All crew alerts</button></div>
  <div class="stack" id="briefs"></div>
</aside>

<section class="hotbar" aria-labelledby="hot-h">
  <h2 id="hot-h">Hotspots</h2>
  <div class="hotrow" id="hotspots"></div>
</section>

<script src="role.js"></script>
<script src="mobility.js"></script>
<script src="strategic_dashboard.js"></script>
<script>
(function () {
  const { T } = I18N, KEY = "geoai.briefs.collapsed", btn = document.getElementById("rtoggle");
  const apply = on => {
    document.body.classList.toggle("rc", on);
    const label = T(on ? "Expand Executive Briefs" : "Collapse Executive Briefs");
    btn.setAttribute("aria-expanded", String(!on)); btn.title = label; btn.setAttribute("aria-label", label);
    try { localStorage.setItem(KEY, on ? "1" : "0"); } catch (e) { /* remembered only when storage is allowed */ }
  };
  let start = true; try { start = localStorage.getItem(KEY) !== "0"; } catch (e) { /* default: collapsed */ }
  apply(start);
  btn.onclick = () => apply(!document.body.classList.contains("rc"));
})();
</script>
</body>
</html>
