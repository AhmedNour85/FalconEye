<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NCCC | Field investigator</title>
<link rel="stylesheet" href="nccc.css">
<link rel="stylesheet" href="rtl.css">
<script src="i18n.js"></script>
<style>
  .fmain{width:100%;max-width:880px;margin:0 auto;padding:14px 16px 40px;display:flex;flex-direction:column;gap:14px}
  .who{display:flex;align-items:center;gap:8px;color:#111827}
  .tcard .meta{color:var(--mut);font-size:13px;margin-top:4px}
  .badge{display:inline-block;border-radius:99px;padding:2px 10px;font-size:12.5px;font-weight:600;background:#d1d5db;color:#111827}
  .badge.go{background:#dcfae9;color:#1b8354}.badge.wait{background:#fef0c7;color:#b54708}
  .pop .sheet{width:min(600px,100%)}
  .pop .sheet-b{display:block}
  .kv{display:grid;grid-template-columns:120px 1fr;gap:6px 12px;margin:10px 0;font-size:14.5px}.kv dt{color:var(--mut)}.kv dd{margin:0}
  .ai{background:#f9fafb;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:10px 0;font-size:14px;color:#374151}
  .ai b{color:#1b8354}
  .opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
  .opts label{display:flex;gap:8px;align-items:flex-start;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px;cursor:pointer;font-size:14px}
  .opts label:has(input:checked){border-color:#1b8354;box-shadow:0 0 0 1px #1b8354}
  .opts small{display:block;color:var(--mut)}
  textarea,input[type=text],input[type=number]{width:100%;background:#f9fafb;border:1px solid var(--line);border-radius:10px;color:var(--tx);padding:10px;font:inherit}
  textarea{min-height:90px;resize:vertical}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .f-l{display:block;margin:10px 0 4px;color:#374151;font-size:14px}
  .actions{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
  .err{color:#b42318;font-size:14px;margin-top:8px}
  .photo-prev{max-width:100%;max-height:180px;border-radius:10px;margin-top:8px;border:1px solid var(--line)}
  @media (max-width:520px){.opts{grid-template-columns:1fr}.kv{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <svg viewBox="0 0 24 24" class="logo" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="8" stroke-dasharray="2 3"/></svg>
    <div><b>NCCC</b><span>Field investigator</span></div>
  </div>
  <label class="who"><span>I am</span> <select id="who" aria-label="Investigator"></select></label>
</header>

<main class="fmain">
  <section class="panel">
    <div class="panel-h"><h2>My assignments</h2><span class="now" id="fnow">Checking…</span></div>
    <div class="feed" id="tasks" aria-live="polite"></div>
  </section>
  <p class="m" style="color:var(--mut);font-size:13px">Demo page: in production the investigator signs in on a phone and receives a push notification. Locations and imagery are simulated.</p>
</main>

<div class="modal pop" id="pop" role="dialog" aria-modal="true" aria-labelledby="pop-h" hidden>
  <div class="sheet">
    <div class="sheet-h"><h2 id="pop-h">New assignment</h2><button class="x" id="pop-x" type="button" aria-label="Close">×</button></div>
    <div class="sheet-b" id="pop-b"></div>
  </div>
</div>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script>
"use strict";
const $ = (s, r = document) => r.querySelector(s);
const { T, TV } = I18N;
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const SEV = { Critical: "#d92d20", High: "#dc6803", Medium: "#f79009", Low: "#1570ef" };
const F = { who: "", tasks: [], shown: new Set(), open: "", photo: null, busy: false };

async function api(path, opts) {
  const r = await fetch(I18N.apiUrl("/api/" + path), opts);
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.detail || r.statusText);
  return j;
}
function toast(msg, sev) {
  const t = document.createElement("div"); t.className = "toast"; t.style.setProperty("--c", SEV[sev] || "#1b8354"); t.textContent = msg;
  $("#toasts").append(t); setTimeout(() => t.remove(), 6000);
}
const due = iso => { const m = Math.round((Date.parse(iso) - Date.now()) / 60000); return m < 0 ? T("overdue") : m < 90 ? T("in {n} min", { n: m }) : T("in {n} h", { n: Math.round(m / 60) }); };

/* ------------------------------------------------------------------ identity + polling */
async function init() {
  const ws = await api("workers");
  const q = new URLSearchParams(location.search).get("worker");
  let me = q || localStorage.getItem("nccc.worker") || ws[0].Worker_ID;
  if (!ws.some(w => w.Worker_ID === me)) me = ws[0].Worker_ID;
  $("#who").innerHTML = ws.map(w => `<option value="${esc(w.Worker_ID)}">${esc(w.Name)} · ${esc(w.Team)}</option>`).join("");
  $("#who").value = me; F.who = me;
  $("#who").onchange = e => { F.who = e.target.value; localStorage.setItem("nccc.worker", F.who); F.shown = new Set(); F.tasks = []; closePop(); poll(); };
  poll(); setInterval(poll, 3000);
}

async function poll() {
  if (F.busy) return;
  let tasks;
  try { tasks = await api("field/tasks/" + encodeURIComponent(F.who)); } catch (e) { $("#fnow").textContent = T("Offline, retrying…"); return; }
  F.tasks = tasks;
  $("#fnow").textContent = tasks.length ? T("{n} open", { n: tasks.length }) : T("Nothing assigned");
  document.title = (tasks.some(t => !t.work_order.Accepted_At) ? "(!) " : "") + T("NCCC | Field investigator");
  renderTasks();
  const fresh = tasks.find(t => !t.work_order.Accepted_At && !F.shown.has(t.work_order.Work_Order_ID));
  if (fresh && !F.open) { F.shown.add(fresh.work_order.Work_Order_ID); openPop(fresh.work_order.Work_Order_ID); ping(fresh); }
  if (F.open && !tasks.some(t => t.work_order.Work_Order_ID === F.open)) closePop();
}

function ping(t) {                                   // a system notification when the browser allows it; the pop-up itself always appears
  try { if ("Notification" in window && Notification.permission === "granted") new Notification(T("New NCCC assignment"), { body: `${TV(t.incident.Incident_Type)} · ${TV(t.incident.Area_Name)}` }); } catch (e) { /* optional */ }
  try { if ("Notification" in window && Notification.permission === "default") Notification.requestPermission(); } catch (e) { /* optional */ }
}

/* ------------------------------------------------------------------ list */
function renderTasks() {
  const box = $("#tasks");
  if (!F.tasks.length) { box.innerHTML = `<div class="empty"><b>${T("No assignments yet")}</b>${T("You will get a pop-up here the moment the operator assigns you an incident.")}</div>`; return; }
  box.innerHTML = F.tasks.map(t => {
    const w = t.work_order, i = t.incident, acc = !!w.Accepted_At;
    const state = !acc ? `<span class="badge wait">${T("Waiting for you")}</span>` : w.Status === "In Progress" ? `<span class="badge go">${T("Confirmed · repair report due")}</span>` : `<span class="badge go">${T("Accepted · report due")}</span>`;
    return `<article class="card tcard ${esc(i.Severity)}" style="--ac:#1b8354"><div class="c-title">${esc(TV(i.Incident_Type))} · ${esc(TV(i.Area_Name))}</div>
      <div class="meta">${esc(i.Incident_ID)} · ${esc(i.Priority)} · ${esc(TV(i.Severity))} · ${esc(w.Work_Order_ID)} · ${T("due {t}", { t: esc(due(w.Due_Date)) })}</div>
      <div class="c-act">${state}<button class="btn ${acc ? "" : "primary"}" data-open="${esc(w.Work_Order_ID)}" type="button">${acc ? T("Open report form") : T("Review assignment")}</button></div></article>`;
  }).join("");
  box.querySelectorAll("[data-open]").forEach(b => b.onclick = () => openPop(b.dataset.open));
}

/* ------------------------------------------------------------------ pop-up */
function closePop() { F.open = ""; $("#pop").hidden = true; }
$("#pop-x").onclick = closePop;
$("#pop").addEventListener("click", e => { if (e.target.id === "pop") closePop(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") closePop(); });

function openPop(woId) {
  const t = F.tasks.find(x => x.work_order.Work_Order_ID === woId); if (!t) return;
  F.open = woId; F.photo = null; $("#pop").hidden = false;
  t.work_order.Accepted_At ? renderForm(t) : renderAssignment(t);
}

const facts = t => `<dl class="kv"><dt>${T("Incident")}</dt><dd><b>${esc(TV(t.incident.Incident_Type))}</b> · ${esc(t.incident.Incident_ID)}</dd>
  <dt>${T("Priority")}</dt><dd><b style="color:${SEV[t.incident.Severity] || "#fff"}">${esc(t.incident.Priority)} · ${esc(TV(t.incident.Severity))}</b></dd>
  <dt>${T("Area")}</dt><dd>${esc(TV(t.incident.Area_Name))} · <bdi>${t.location.lat.toFixed(5)}, ${t.location.lon.toFixed(5)}</bdi></dd>
  <dt>${T("Due")}</dt><dd>${esc(due(t.work_order.Due_Date))}</dd><dt>${T("Work order")}</dt><dd>${esc(t.work_order.Work_Order_ID)} · ${esc(TV(t.work_order.Assigned_Team))}</dd></dl>
  <div class="ai"><b>${T("What the AI found")}</b> ${T("(not confirmed):")} ${t.ai_finding.map(f => esc(f.evidence)).join("<br>") || T("no detail")}</div>
  <p style="color:#374151;font-size:14.5px"><b>${T("Your task:")}</b> ${esc(t.instructions)}</p>`;

function renderAssignment(t) {
  $("#pop-h").textContent = T("New assignment");
  $("#pop-b").innerHTML = facts(t) + `<div class="actions"><button class="btn primary" id="acc" type="button">${T("Accept assignment")}</button><button class="btn" id="later" type="button">${T("Later")}</button></div><p class="err" id="perr" hidden></p>`;
  $("#later").onclick = closePop;
  $("#acc").onclick = async e => {
    e.target.disabled = true;
    try {
      const fd = new FormData(); fd.set("work_order_id", t.work_order.Work_Order_ID); fd.set("worker_id", F.who);
      await api("field/accept", { method: "POST", body: fd });
      toast(T("Assignment accepted. The operator has been told."), "Low");
      await poll(); const nt = F.tasks.find(x => x.work_order.Work_Order_ID === t.work_order.Work_Order_ID); nt ? renderForm(nt) : closePop();
    } catch (err) { $("#perr").hidden = false; $("#perr").textContent = err.message; e.target.disabled = false; }
  };
}

function renderForm(t) {
  const confirmed = t.work_order.Status === "In Progress";
  const opts = confirmed
    ? [["Repaired", T("Repaired"), T("The fault is fixed and the area is safe")], ["Needs Further Inspection", T("Needs more work"), T("Not finished yet")], ["Escalate", T("Escalate"), T("Needs a specialist team")]]
    : [["Confirmed", T("Yes, confirmed"), T("The fault or change is there")], ["Rejected", T("Not found"), T("Nothing wrong at this location")], ["Needs Further Inspection", T("Need to look again"), T("Could not decide on this visit")], ["Escalate", T("Escalate"), T("Dangerous or too large for me")]];
  $("#pop-h").textContent = confirmed ? T("Report the repair") : T("Confirm the incident");
  $("#pop-b").innerHTML = facts(t) + `<form id="rf" autocomplete="off"><div class="opts" role="radiogroup" aria-label="${T("Outcome")}">${opts.map((o, k) => `<label><input type="radio" name="status" value="${o[0]}"${k === 0 ? " checked" : ""}><span><b>${o[1]}</b><small>${o[2]}</small></span></label>`).join("")}</div>
    <label class="f-l" for="obs">${T("What did you see? (required)")}</label><textarea id="obs" required minlength="5" placeholder="${T("For example: water seeping through the asphalt near the valve chamber")}"></textarea>
    <div class="row2"><div><label class="f-l" for="lat">${T("Latitude")}</label><input id="lat" type="number" step="any" required value="${t.location.lat.toFixed(6)}"></div><div><label class="f-l" for="lon">${T("Longitude")}</label><input id="lon" type="number" step="any" required value="${t.location.lon.toFixed(6)}"></div></div>
    <div class="actions" style="margin-top:8px"><button class="btn" id="gps" type="button">${T("Use my device location")}</button><span class="m" id="gpsn" style="color:var(--mut);font-size:13px;align-self:center">${T("Prefilled with the incident location for the demo.")}</span></div>
    <label class="f-l" for="photo">${T("Photo (optional)")}</label><input id="photo" type="file" accept="image/*" capture="environment"><img class="photo-prev" id="prev" alt="${T("Photo preview")}" hidden>
    <div class="actions"><button class="btn primary" id="send" type="submit">${T("Send report")}</button><button class="btn" id="cancel" type="button">${T("Close")}</button></div><p class="err" id="perr" hidden></p></form>`;
  $("#cancel").onclick = closePop;
  $("#gps").onclick = () => {
    if (!navigator.geolocation) { $("#gpsn").textContent = T("This device has no location service."); return; }
    $("#gpsn").textContent = T("Locating…");
    navigator.geolocation.getCurrentPosition(p => { $("#lat").value = p.coords.latitude.toFixed(6); $("#lon").value = p.coords.longitude.toFixed(6); $("#gpsn").textContent = T("Using your device location."); },
      () => { $("#gpsn").textContent = T("Could not read your location; keep the prefilled one."); }, { enableHighAccuracy: true, timeout: 8000 });
  };
  $("#photo").onchange = e => { F.photo = e.target.files[0] || null; const pv = $("#prev"); if (F.photo) { pv.src = URL.createObjectURL(F.photo); pv.hidden = false; } else pv.hidden = true; };
  $("#rf").onsubmit = async e => {
    e.preventDefault(); const btn = $("#send"); btn.disabled = true; btn.textContent = T("Sending…"); F.busy = true;
    try {
      const fd = new FormData();
      fd.set("work_order_id", t.work_order.Work_Order_ID); fd.set("worker_id", F.who); fd.set("status", new FormData(e.target).get("status"));
      fd.set("observation", $("#obs").value); fd.set("lat", $("#lat").value); fd.set("lon", $("#lon").value);
      if (F.photo) fd.set("photo", F.photo);
      const r = await api("field/submit", { method: "POST", body: fd });
      closePop(); toast(T("Report sent. The operator can see it now ({o}).", { o: TV(r.outcome) }), "Low");
      if (r.photo_saved === false) toast(T("Your report was saved, but the photo was not. You can send the photo again later."), "High");
    } catch (err) { $("#perr").hidden = false; $("#perr").textContent = err.message; btn.disabled = false; btn.textContent = T("Send report"); }
    finally { F.busy = false; poll(); }
  };
}

init();
</script>
</body>
</html>
