<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cards and map · Falcon Eye sample</title>
<meta name="description" content="Layout sample K: alert cards on the left, the map, Ask and the data feeds on the right, the crew as a row of faces.">
<link rel="stylesheet" href="https://js.arcgis.com/4.30/esri/themes/light/main.css">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<script src="https://cdn.tailwindcss.com/3.4.16"></script>
<script src="ui-kit.js"></script>
<script>ukTheme(false)</script>
<link rel="stylesheet" href="ui-kit.css">
<script src="https://js.arcgis.com/4.30/"></script>
</head>
<body class="min-h-screen bg-muted/30">
<a href="#alerts-h" class="sr-only focus:not-sr-only focus:fixed focus:left-2 focus:top-2 focus:z-50 focus:rounded-md focus:bg-primary focus:px-3 focus:py-2 focus:text-primary-foreground">Skip to alerts</a>
<header class="sticky top-0 z-30 border-b bg-background/95 backdrop-blur">
  <div class="mx-auto flex h-14 max-w-[1440px] items-center gap-3 px-4 lg:px-6"><h1 class="flex items-center gap-2 font-semibold" id="brand">Falcon Eye</h1><div class="ml-auto" id="tools"></div></div>
</header>
<main class="mx-auto max-w-[1440px] space-y-6 p-4 lg:p-6">
  <section class="grid grid-cols-2 gap-4 xl:grid-cols-4" aria-label="Key numbers" id="stats"></section>
  <div class="grid grid-cols-1 gap-6 lg:grid-cols-[minmax(0,1fr)_minmax(0,1.05fr)]">
    <div class="min-w-0 space-y-4">
      <section class="rounded-lg border bg-card p-4 shadow-sm" aria-labelledby="crew-h">
        <div class="flex flex-wrap items-center gap-3"><h2 id="crew-h" class="font-semibold">Digital crew</h2><span class="rounded-md bg-primary/10 px-2 py-0.5 text-xs font-medium text-primary">2 working</span>
          <div class="flex -space-x-2" id="faces"></div>
          <button type="button" id="crew-btn" aria-expanded="false" aria-controls="crew-list" class="ml-auto inline-flex h-8 items-center rounded-md px-3 text-xs font-medium hover:bg-accent focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring">Show all 11</button></div>
        <p class="mt-3 text-sm text-muted-foreground" id="now"></p>
        <ul id="crew-list" hidden class="mt-3 grid gap-2 sm:grid-cols-2"></ul>
      </section>
      <section aria-labelledby="alerts-h">
        <div class="mb-3 flex flex-wrap items-center gap-3"><h2 id="alerts-h" class="text-lg font-semibold" tabindex="-1">Alerts</h2>
          <div class="ml-auto inline-flex h-9 items-center rounded-md bg-muted p-1 text-muted-foreground" role="group" aria-label="Filter alerts"><button type="button" id="f-action" class="rounded-sm px-3 py-1 text-sm font-medium">Needs action</button><button type="button" id="f-all" class="rounded-sm px-3 py-1 text-sm font-medium">All</button></div></div>
        <div id="cards" class="space-y-4" aria-live="polite"></div>
      </section>
    </div>
    <div class="min-w-0 space-y-4 lg:sticky lg:top-20 lg:self-start">
      <section class="overflow-hidden rounded-lg border bg-card shadow-sm" aria-label="Map"><div id="map" class="h-[min(52vh,520px)] min-h-[300px]" role="img" aria-label="Map of open incidents in Riyadh"></div></section>
      <form class="flex gap-2 rounded-lg border bg-card p-3 shadow-sm" onsubmit="event.preventDefault();ukToast('Sample only: the crew would answer here.')"><label class="sr-only" for="q">Question for the crew</label>
        <input id="q" name="q" autocomplete="off" placeholder="Ask the crew… e.g. “Which incident needs attention first?”" class="h-10 min-w-0 flex-1 rounded-md border border-input bg-background px-3 text-sm placeholder:text-muted-foreground focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring">
        <button type="submit" class="inline-flex h-10 items-center rounded-md bg-primary px-5 text-sm font-medium text-primary-foreground hover:bg-primary/90 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2">Ask</button></form>
      <section class="rounded-lg border bg-card p-4 shadow-sm" aria-labelledby="feeds-h"><h2 id="feeds-h" class="text-sm font-semibold">Data feeds</h2><ul class="mt-3 grid gap-2 sm:grid-cols-2" id="feeds"></ul></section>
    </div>
  </div>
</main>
<script src="live-samples.js"></script>
<script>
  ukSampleBar("Sample K · Cards and map");
  $("#brand").innerHTML = UK_LOGO + "Falcon Eye"; $("#tools").innerHTML = ukTools();
  $("#faces").innerHTML = AGENTS.map(a => ukAvatar(a.id, "h-7 w-7 text-[11px]")).join("");
  $("#now").innerHTML = `<span class="font-medium text-foreground">Noura</span> ${WORKING.noura} · <span class="font-medium text-foreground">Turki</span> ${WORKING.turki}`;
  $("#crew-list").innerHTML = AGENTS.map(a => `<li class="flex items-center gap-2 rounded-md border px-2 py-1.5 text-sm">${ukAvatar(a.id, "h-7 w-7 text-xs")}<span class="min-w-0"><span class="block font-medium leading-tight">${a.name}</span><span class="block truncate text-xs text-muted-foreground">${a.role}</span></span></li>`).join("");
  $("#crew-btn").onclick = e => { const l = $("#crew-list"), open = l.hidden; l.hidden = !open; e.target.setAttribute("aria-expanded", open); e.target.textContent = open ? "Hide" : "Show all 11"; };
  $("#feeds").innerHTML = FEEDS.map(([name, d, at, a, alert]) => `<li class="rounded-md border p-3 ${alert ? "border-orange-500/40" : ""}"><p class="flex items-center gap-2 text-sm font-medium"><span class="h-2 w-2 rounded-full" style="background:${AG[a].color}" aria-hidden="true"></span>${name}</p><p class="mt-1 truncate text-xs text-muted-foreground" title="${d}">${d}</p><p class="text-xs text-muted-foreground">${at ? "Updated " + at : "Waiting for data"} · ${AG[a].name}</p></li>`).join("");
  const SEVB = { Critical: "border-l-red-600", High: "border-l-orange-500", Medium: "border-l-amber-500", Low: "border-l-blue-600", Info: "border-l-slate-400" };
  function render() {
    $("#stats").innerHTML = ukStats();
    [["f-action", "action"], ["f-all", "all"]].forEach(([id, t]) => { const b = $("#" + id), on = S.tab === t; b.setAttribute("aria-pressed", on); b.className = `rounded-sm px-3 py-1 text-sm font-medium transition-colors ${on ? "bg-background text-foreground shadow-sm" : "hover:text-foreground"}`; });
    const st = ukStateBlock();
    $("#cards").innerHTML = st ? ukCard(st) : ukViewerNote() + visible().map(n => `<article id="c-${n.id}" class="rounded-lg border border-l-4 ${SEVB[n.sev]} bg-card p-4 shadow-sm transition-shadow hover:shadow-md ${n.done ? "opacity-75" : ""}" aria-labelledby="t-${n.id}">${ukDetail(n, "h3").replace('<h3 class="', `<h3 id="t-${n.id}" class="`)}</article>`).join("");
  }
  UK.render = render;
  $("#f-action").onclick = () => { S.tab = "action"; render(); }; $("#f-all").onclick = () => { S.tab = "all"; render(); };
  ukWire(); render();
  ukMap("map", id => { const el = $("#c-" + id); if (el) { el.scrollIntoView({ behavior: "smooth", block: "center" }); el.classList.add("ring-2", "ring-ring"); setTimeout(() => el.classList.remove("ring-2", "ring-ring"), 1600); } });
</script>
</body>
</html>
