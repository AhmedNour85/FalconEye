<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Table and sheet · Falcon Eye sample</title>
<meta name="description" content="Layout sample J: a sidebar with the crew, the alerts as a table, and the selected alert in a side sheet.">
<link rel="stylesheet" href="https://js.arcgis.com/4.30/esri/themes/light/main.css">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<script src="https://cdn.tailwindcss.com/3.4.16"></script>
<script src="ui-kit.js"></script>
<script>ukTheme(false)</script>
<link rel="stylesheet" href="ui-kit.css">
<script src="https://js.arcgis.com/4.30/"></script>
</head>
<body class="min-h-screen">
<a href="#alerts-h" class="sr-only focus:not-sr-only focus:fixed focus:left-2 focus:top-2 focus:z-50 focus:rounded-md focus:bg-primary focus:px-3 focus:py-2 focus:text-primary-foreground">Skip to alerts</a>
<div class="flex min-h-screen">
  <aside class="hidden w-64 shrink-0 flex-col border-r bg-muted/40 lg:flex" aria-label="Navigation and crew">
    <div class="flex h-14 items-center gap-2 border-b px-4 font-semibold"><span id="brand"></span></div>
    <nav class="p-3" aria-label="Pages"><ul class="space-y-1 text-sm">
      <li><a aria-current="page" class="flex items-center gap-2 rounded-md bg-accent px-3 py-2 font-medium text-accent-foreground" href="j-table-sheet.html">Operation</a></li>
      <li><span class="flex items-center justify-between rounded-md px-3 py-2 text-muted-foreground">Executive hub <span class="text-xs">in the app</span></span></li>
      <li><span class="flex items-center justify-between rounded-md px-3 py-2 text-muted-foreground">Investigator <span class="text-xs">in the app</span></span></li></ul></nav>
    <div class="mt-2 flex-1 overflow-auto border-t px-3 py-3"><h2 class="px-2 text-xs font-medium uppercase tracking-wide text-muted-foreground">Digital crew · 2 working</h2><ul class="mt-2 space-y-1" id="crew"></ul></div>
  </aside>
  <div class="flex min-w-0 flex-1 flex-col">
    <header class="sticky top-0 z-30 flex h-14 items-center gap-3 border-b bg-background/95 px-4 backdrop-blur lg:px-6">
      <h1 class="sr-only">Falcon Eye operation</h1>
      <span class="lg:hidden" id="brand-m"></span>
      <nav aria-label="Breadcrumb" class="hidden text-sm text-muted-foreground lg:block"><ol class="flex items-center gap-1.5"><li>Falcon Eye</li><li aria-hidden="true">/</li><li class="font-medium text-foreground" aria-current="page">Operation</li></ol></nav>
      <div class="ml-auto" id="tools"></div>
    </header>
    <main class="flex-1 space-y-6 p-4 lg:p-6">
      <section class="grid grid-cols-2 gap-4 xl:grid-cols-4" aria-label="Key numbers" id="stats"></section>
      <div class="grid grid-cols-1 gap-6 xl:grid-cols-[minmax(0,1fr)_400px]">
        <section class="min-w-0 rounded-lg border bg-card shadow-sm" aria-labelledby="alerts-h">
          <div class="flex flex-wrap items-center gap-3 border-b p-4"><div><h2 id="alerts-h" class="font-semibold leading-none" tabindex="-1">Alerts</h2><p class="mt-1 text-sm text-muted-foreground">Decisions first. Open a row to see it in full.</p></div>
            <div class="ml-auto inline-flex h-9 items-center rounded-md bg-muted p-1 text-muted-foreground" role="group" aria-label="Filter alerts">
              <button type="button" id="f-action" class="rounded-sm px-3 py-1 text-sm font-medium">Needs action</button><button type="button" id="f-all" class="rounded-sm px-3 py-1 text-sm font-medium">All</button></div></div>
          <div id="table" class="p-2"></div>
        </section>
        <div class="space-y-6">
          <section class="overflow-hidden rounded-lg border bg-card shadow-sm" aria-label="Map"><div id="map" class="h-[340px]" role="img" aria-label="Map of open incidents in Riyadh"></div></section>
          <section class="rounded-lg border bg-card p-4 shadow-sm" aria-labelledby="ask-h"><h2 id="ask-h" class="text-sm font-semibold">Ask the crew</h2>
            <form class="mt-3 flex gap-2" onsubmit="event.preventDefault();ukToast('Sample only: the crew would answer here.')"><label class="sr-only" for="q">Question for the crew</label>
              <input id="q" name="q" autocomplete="off" placeholder="Which incident needs attention first?" class="h-9 min-w-0 flex-1 rounded-md border border-input bg-background px-3 text-sm shadow-sm placeholder:text-muted-foreground focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring">
              <button type="submit" class="inline-flex h-9 items-center rounded-md bg-primary px-4 text-sm font-medium text-primary-foreground shadow-sm hover:bg-primary/90 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2">Ask</button></form></section>
          <section class="rounded-lg border bg-card p-4 shadow-sm" aria-labelledby="act-h"><h2 id="act-h" class="text-sm font-semibold">Latest hand-offs</h2><ul class="mt-3 space-y-3" id="activity"></ul></section>
        </div>
      </div>
    </main>
  </div>
</div>
<dialog id="sheet" class="uk-sheet border-l bg-background p-0 shadow-xl" aria-labelledby="sheet-t">
  <div class="flex h-full flex-col"><div class="flex items-center justify-between border-b px-5 py-3"><h2 id="sheet-t" class="text-sm font-medium text-muted-foreground">Alert</h2>
    <form method="dialog"><button class="inline-flex h-8 w-8 items-center justify-center rounded-md hover:bg-accent focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring" aria-label="Close">✕</button></form></div>
    <div class="flex-1 overflow-auto p-5" id="sheet-body"></div></div></dialog>
<script src="live-samples.js"></script>
<script>
  ukSampleBar("Sample J · Table and sheet");
  $("#brand").outerHTML = UK_LOGO + "Falcon Eye"; $("#brand-m").innerHTML = `<span class="flex items-center gap-2 font-semibold">${UK_LOGO}Falcon Eye</span>`;
  $("#tools").innerHTML = ukTools();
  $("#crew").innerHTML = AGENTS.map(a => `<li class="flex items-center gap-2 rounded-md px-2 py-1.5 text-sm">${ukAvatar(a.id, "h-7 w-7 text-xs")}<span class="min-w-0"><span class="block font-medium leading-tight">${a.name}</span><span class="block truncate text-xs ${WORKING[a.id] ? "text-primary" : "text-muted-foreground"}">${WORKING[a.id] ? "Working · " + WORKING[a.id] : "Active " + ACTIVE[a.id] + " ago"}</span></span></li>`).join("");
  $("#activity").innerHTML = ACTIVITY.map(([a, act, d]) => `<li class="flex items-start gap-2 text-sm">${ukAvatar(a, "h-6 w-6 text-[11px]")}<span class="min-w-0"><span class="font-medium">${AG[a].name}</span> ${esc(act)}<span class="block text-xs text-muted-foreground">${esc(d)}</span></span></li>`).join("");
  let openId = "";
  const row = n => `<tr class="border-b transition-colors hover:bg-muted/50 ${openId === n.id ? "bg-muted/60" : ""}">
      <td class="p-3 align-top">${ukBadge(n.sev, n.sev)}</td>
      <td class="max-w-0 p-3 align-top w-full"><button type="button" data-uk="open" data-id="${n.id}" class="block max-w-full text-left font-medium hover:underline focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring rounded-sm [overflow-wrap:anywhere]">${esc(n.title)}</button>
        <span class="mt-0.5 block text-xs text-muted-foreground">${n.ago}${n.apr ? " · " + n.apr : ""}</span></td>
      <td class="hidden p-3 align-top md:table-cell"><span class="flex items-center gap-2 whitespace-nowrap text-sm">${ukAvatar(n.agent, "h-6 w-6 text-[11px]")}${AG[n.agent].name}</span></td>
      <td class="hidden p-3 align-top text-sm sm:table-cell whitespace-nowrap ${n.done === "approve" ? "text-primary font-medium" : n.error ? "text-red-600 dark:text-red-400 font-medium" : "text-muted-foreground"}">${ukStatus(n)}</td>
      <td class="p-3 align-top"><div class="flex justify-end gap-2">${n.error && !isViewer() ? ukBtn("Try again", "default", "sm", `data-uk="retry" data-id="${n.apr}" aria-label="Try again to approve ${esc(n.apr + " · " + n.title)}"`) : ""}${n.apr && !n.done && !n.error && !isViewer() ? ukBtn("Approve", "default", "sm", `data-uk="approve" data-id="${n.apr}" aria-label="Approve ${esc(n.apr + " · " + n.title)}"`) : ""}<span class="hidden sm:inline-flex">${ukBtn("Open", "outline", "sm", `data-uk="open" data-id="${n.id}" aria-label="Open ${esc(n.title)}"`)}</span></div></td></tr>`;
  function render() {
    $("#stats").innerHTML = ukStats();
    [["f-action", "action"], ["f-all", "all"]].forEach(([id, t]) => { const b = $("#" + id), on = S.tab === t; b.setAttribute("aria-pressed", on); b.className = `rounded-sm px-3 py-1 text-sm font-medium transition-colors ${on ? "bg-background text-foreground shadow-sm" : "hover:text-foreground"}`; });
    const st = ukStateBlock();
    $("#table").innerHTML = st || (ukViewerNote() ? `<div class="p-2">${ukViewerNote()}</div>` : "") + `<table class="w-full caption-bottom text-sm"><caption class="sr-only">Alerts, decisions first</caption>
      <thead><tr class="border-b text-left text-xs text-muted-foreground"><th scope="col" class="h-10 px-3 font-medium">Severity</th><th scope="col" class="h-10 px-3 font-medium">Alert</th><th scope="col" class="hidden h-10 px-3 font-medium md:table-cell">Raised by</th><th scope="col" class="hidden h-10 px-3 font-medium sm:table-cell">Status</th><th scope="col" class="h-10 px-3 text-right font-medium"><span class="sr-only">Actions</span></th></tr></thead>
      <tbody>${visible().map(row).join("")}</tbody></table>`;
    if ($("#sheet").open && openId) $("#sheet-body").innerHTML = ukDetail(ALERTS.find(a => a.id === openId), "h3");
  }
  UK.render = render;
  UK.open = id => { openId = id; const n = ALERTS.find(a => a.id === id); $("#sheet-t").textContent = n.inc || "Alert"; $("#sheet-body").innerHTML = ukDetail(n, "h3"); if (!$("#sheet").open) $("#sheet").showModal(); render(); if (n.lon && MAP) MAP.view.goTo({ center: [n.lon, n.lat], zoom: 14 }); };
  /* back to the row's own button; the table is redrawn, so find it again after the dialog has restored its focus */
  $("#sheet").addEventListener("close", () => { const id = openId; openId = ""; render(); setTimeout(() => $(`[data-uk="open"][data-id="${id}"]`)?.focus(), 0); });
  $("#f-action").onclick = () => { S.tab = "action"; render(); }; $("#f-all").onclick = () => { S.tab = "all"; render(); };
  ukWire(); render(); ukMap("map", id => UK.open(id));
</script>
</body>
</html>
